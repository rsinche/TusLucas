# Al subir un tag "v*" (ej. v1.1): compila el APK firmado y lo publica como release.
# La web descarga siempre releases/latest/download/TusLucas.apk, así que el nombre no debe cambiar.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    # Imagen fija: trae el SDK de Android ya instalado ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Gradle descarga solo la plataforma que falte (compileSdk), si las licencias están aceptadas
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      # La llave de firma vive en los secrets del repo, nunca en git
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > tuslucas-release.jks
          cat > keystore.properties <<EOF
          storeFile=../tuslucas-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk TusLucas.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: Tus Lucas ${{ github.ref_name }}
          files: TusLucas.apk
          generate_release_notes: true
